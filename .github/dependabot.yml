version: 2

registries:
  public-npm:
    type: npm-registry
    url: https://registry.npmjs.org


updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    directory: "/litvoice-api"
    registries:
      - public-npm
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/litvoice-web"
    registries:
      - public-npm
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"


  # Keep the runtime base image (Dockerfile `FROM`) patched. Combined with
  # the `container-scan.yml` workflow, this catches base-image CVEs early.
  - package-ecosystem: docker
    directory: "/litvoice-api"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 8
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"